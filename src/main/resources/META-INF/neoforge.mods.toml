modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''${mod_description}'''
authors="${mod_authors}"


[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# DoABarrelRoll 是硬依赖：compat.DaBRRollFreeze 直接引用它的 public API
# （RollGroup / RollEntity / DoABarrelRollClient），靠它实现"刹车时不翻滚"。
# 下界 3.7.5 是 RollGroup.falseUnless(Supplier, int) 语义确认可用的最早版本。
[[dependencies.elytradrag]]
modId="do_a_barrel_roll"
type="required"
versionRange="[3.7.5,)"
ordering="NONE"
side="CLIENT"

logoFile="assets/elytradrag/icon.png"
