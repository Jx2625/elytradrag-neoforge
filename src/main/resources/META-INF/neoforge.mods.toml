modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''${mod_description}'''
authors="${mod_authors}"


[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# DoABarrelRoll 是硬依赖：compat.DaBRRollFreeze 直接引用它的 public API
# （RollGroup / RollEntity / DoABarrelRollClient），靠它实现"刹车时不翻滚"。
# 下界 3.8.2：从这一版起 DaBR 自己修掉了"输入 context 失效 / 按住修饰键"时丢按键事件的
# 问题，本项目因此删掉了键盘状态的兜底逻辑，不再兼容更早的版本。
[[dependencies.elytradrag]]
modId="do_a_barrel_roll"
type="required"
versionRange="[3.8.2,)"
ordering="NONE"
side="CLIENT"

logoFile="assets/elytradrag/icon.png"
